function saveImage(src){

  const html = `

    <!DOCTYPE html>

    <html lang="ja">

    <head>

      <meta name="viewport" content="width=device-width,initial-scale=1.0">

      <style>

        body{

          margin:0;

          background:#000;

          display:flex;

          justify-content:center;

          align-items:center;

          min-height:100vh;

        }

        img{

          width:100%;

          height:auto;

          object-fit:contain;

        }

      </style>

    </head>

    <body>

      <img src="${src}">

    </body>

    </html>

  `;

  const w = window.open();

  w.document.open();

  w.document.write(html);

  w.document.close();

}
