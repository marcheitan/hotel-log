<escape>

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HOTEL LOG</title>

<style>

body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f4f4f4}

header{background:#1f2937;color:#fff;padding:16px;text-align:center}

main{max-width:800px;margin:auto;padding:16px}

.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}

input,textarea{width:100%;padding:10px;margin-top:6px;margin-bottom:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}

button{background:#2563eb;color:#fff;border:none;padding:12px 16px;border-radius:10px;font-weight:bold;width:100%}

.entry{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}

img{width:100%;border-radius:10px;margin-top:8px}

.small{color:#666;font-size:13px}

.delete{background:#dc2626;margin-top:8px}

</style>

</head>

<body>

<header>

<h2>HOTEL LOG</h2>

<div>写真保存対応版</div>

</header>

<main>

<div class="card">

<h3>新規登録</h3>

<label>ホテル名</label>

<input id="hotel" placeholder="例：ホテル〇〇">

<label>日付</label>

<input id="date" type="date">

<label>メモ</label>

<textarea id="memo" rows="4" placeholder="内容を入力"></textarea>

<label>写真</label>

<input id="photo" type="file" accept="image/*">

<button onclick="save()">保存する</button>

</div>

<div class="card">

<h3>履歴</h3>

<div id="list"></div>

</div>

</main>

<script>

const KEY="hotel_log_data";

function load(){

  const data=JSON.parse(localStorage.getItem(KEY)||"[]");

  const list=document.getElementById("list");

  list.innerHTML="";

  if(data.length===0){

    list.innerHTML="<p class='small'>まだ記録はありません。</p>";

    return;

  }

  data.reverse().forEach((e,i)=>{

    const d=document.createElement("div");

    d.className="entry";

    d.innerHTML=`

      <strong>${e.hotel}</strong><br>

      <span class="small">${e.date}</span>

      <p>${(e.memo||"").replace(/\n/g,"<br>")}</p>

      ${e.photo?`<img src="${e.photo}">`:""}

      <button class="delete" onclick="removeItem(${data.length-1-i})">削除</button>

    `;

    list.appendChild(d);

  });

}

function save(){

  const hotel=document.getElementById("hotel").value.trim();

  const date=document.getElementById("date").value;

  const memo=document.getElementById("memo").value;

  const file=document.getElementById("photo").files[0];

  if(!hotel){alert("ホテル名を入力してください");return;}

  const reader=new FileReader();

  reader.onload=function(){

    const data=JSON.parse(localStorage.getItem(KEY)||"[]");

    data.push({

      hotel,

      date,

      memo,

      photo:file?reader.result:""

    });

    localStorage.setItem(KEY,JSON.stringify(data));

    document.getElementById("hotel").value="";

    document.getElementById("date").value="";

    document.getElementById("memo").value="";

    document.getElementById("photo").value="";

    load();

  };

  if(file){reader.readAsDataURL(file);}

  else{reader.onload();}

}

function removeItem(index){

  const data=JSON.parse(localStorage.getItem(KEY)||"[]");

  data.splice(index,1);

  localStorage.setItem(KEY,JSON.stringify(data));

  load();

}

load();

</script>

</body>

</html>

</escape>
