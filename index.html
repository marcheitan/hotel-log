<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HOTEL LOG</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,sans-serif;

  background:#f3f4f6;

}

header{

  background:#111827;

  color:#fff;

  text-align:center;

  padding:18px;

}

main{

  max-width:720px;

  margin:auto;

  padding:16px;

}

.card{

  background:#fff;

  border-radius:12px;

  padding:16px;

  margin-bottom:16px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

}

label{

  display:block;

  margin-top:12px;

  font-weight:bold;

}

input,textarea{

  width:100%;

  padding:10px;

  margin-top:6px;

  border:1px solid #ccc;

  border-radius:8px;

  font-size:16px;

}

button{

  width:100%;

  margin-top:16px;

  padding:12px;

  background:#2563eb;

  color:#fff;

  border:none;

  border-radius:8px;

  font-size:16px;

  font-weight:bold;

}

.item{

  border-top:1px solid #ddd;

  margin-top:14px;

  padding-top:14px;

}

.item img{

  width:100%;

  border-radius:8px;

  margin-top:8px;

}

.del{background:#dc2626}

.empty{

  text-align:center;

  color:#666;

}

</style>

</head>

<body>

<header>

<h2>HOTEL LOG</h2>

<p>写真保存対応版</p>

</header>

<main>

<div class="card">

<h3>新規登録</h3>

<label>ホテル名</label>

<input id="hotel">

<label>利用日</label>

<input id="date" type="date">

<label>メモ</label>

<textarea id="memo" rows="4"></textarea>

<label>写真</label>

<input id="photo" type="file" accept="image/*">

<button onclick="save()">保存する</button>

</div>

<div class="card">

<h3>履歴</h3>

<div id="list"></div>

</div>

</main>

<script>

const KEY="hotel_log_v4";

function getData(){

  return JSON.parse(localStorage.getItem(KEY)||"[]");

}

function setData(data){

  localStorage.setItem(KEY,JSON.stringify(data));

}

function clearForm(){

  hotel.value="";

  date.value="";

  memo.value="";

  photo.value="";

}

function escapeHtml(s){

  return (s||"")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;");

}

function load(){

  const data=getData();

  const list=document.getElementById("list");

  list.innerHTML="";

  if(data.length===0){

    list.innerHTML='<div class="empty">まだ記録はありません</div>';

    return;

  }

  [...data].reverse().forEach((r,i)=>{

    const idx=data.length-1-i;

    const div=document.createElement("div");

    div.className="item";

    div.innerHTML=`

      <strong>${escapeHtml(r.hotel)}</strong><br>

      <small>${r.date||""}</small>

      <div style="white-space:pre-wrap;margin-top:8px">

        ${escapeHtml(r.memo)}

      </div>

      ${r.photo ? `<img src="${r.photo}">` : ""}

      <button class="del" onclick="removeItem(${idx})">削除</button>

    `;

    list.appendChild(div);

  });

}

function removeItem(index){

  if(!confirm("削除しますか？")) return;

  const data=getData();

  data.splice(index,1);

  setData(data);

  load();

}
function save(){

  const hotelName=hotel.value.trim();

  if(hotelName===""){

    alert("ホテル名を入力してください");

    return;

  }

  const data=getData();

  const record={

    hotel:hotelName,

    date:date.value,

    memo:memo.value,

    photo:""

  };

  const file=photo.files[0];

  const finish=()=>{

    data.push(record);

    setData(data);

    clearForm();

    load();

    alert("保存しました");

  };

  if(!file){

    finish();

    return;

  }

  const reader=new FileReader();

  reader.onload=(e)=>{

    const img=new Image();

    img.onload=()=>{

      const canvas=document.createElement("canvas");

      const max=800;

      let w=img.width;

      let h=img.height;

      if(w>h && w>max){

        h=Math.round(h*max/w);

        w=max;

      }else if(h>max){

        w=Math.round(w*max/h);

        h=max;

      }

      canvas.width=w;

      canvas.height=h;

      const ctx=canvas.getContext("2d");

      ctx.drawImage(img,0,0,w,h);

      record.photo=canvas.toDataURL("image/jpeg",0.7);

      finish();

    };

    img.src=e.target.result;

  };

  reader.readAsDataURL(file);

}

load();

</script>

</body>

</html>
