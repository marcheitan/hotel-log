<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HOTEL LOG</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

  background:#f3f4f6;

}

header{

  background:#111827;

  color:#fff;

  padding:18px;

  text-align:center;

}

main{

  max-width:720px;

  margin:auto;

  padding:16px;

}

.card{

  background:#fff;

  border-radius:14px;

  padding:16px;

  margin-bottom:16px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

}

label{

  display:block;

  margin-top:12px;

  font-weight:600;

}

input,textarea{

  width:100%;

  padding:10px;

  margin-top:6px;

  border:1px solid #d1d5db;

  border-radius:10px;

  font-size:16px;

}

textarea{resize:vertical}

button{

  width:100%;

  margin-top:16px;

  padding:13px;

  border:none;

  border-radius:10px;

  background:#2563eb;

  color:#fff;

  font-size:16px;

  font-weight:bold;

}

.entry{

  border-top:1px solid #e5e7eb;

  padding-top:14px;

  margin-top:14px;

}

.entry img{

  width:100%;

  border-radius:10px;

  margin-top:10px;

}

.meta{

  color:#6b7280;

  font-size:14px;

}

.del{

  background:#dc2626;

}

.empty{

  color:#6b7280;

  text-align:center;

  padding:20px;

}

</style>

</head>

<body>

<header>

  <h2>HOTEL LOG</h2>

  <div>写真保存対応版</div>

</header>

<main>

<div class="card">

  <h3>新規登録</h3>

  <label>ホテル名</label>

  <input id="hotel" placeholder="ホテル名">

  <label>利用日</label>

  <input id="date" type="date">

  <label>メモ</label>

  <textarea id="memo" rows="4"></textarea>

  <label>写真</label>

  <input id="photo" type="file" accept="image/*">

  <button id="saveBtn">保存する</button>

</div>

<div class="card">

  <h3>履歴</h3>

  <div id="list"></div>

</div>

</main>

<script>

const KEY="hotel_log_v2";

const hotel=document.getElementById("hotel");

const date=document.getElementById("date");

const memo=document.getElementById("memo");

const photo=document.getElementById("photo");

const list=document.getElementById("list");

document.getElementById("saveBtn").addEventListener("click",save);

function getData(){

  return JSON.parse(localStorage.getItem(KEY)||"[]");

}

function setData(data){

  localStorage.setItem(KEY,JSON.stringify(data));

}

function clearForm(){

  hotel.value="";

  date.value="";

  memo.value="";

  photo.value="";

}

function save(){

  if(hotel.value.trim()===""){

    alert("ホテル名を入力してください");

    return;

  }

  const data=getData();

  const record={

    hotel:hotel.value.trim(),

    date:date.value,

    memo:memo.value,

    photo:""

  };

  const file=photo.files[0];

  if(file){

    const reader=new FileReader();

    reader.onload=function(e){

      record.photo=e.target.result;

      data.push(record);

      setData(data);

      clearForm();

      load();

      alert("保存しました");

    };

    reader.readAsDataURL(file);

  }else{

    data.push(record);

    setData(data);

    clearForm();

    load();

    alert("保存しました");

  }

}

function removeItem(index){

  if(!confirm("削除しますか？")) return;

  const data=getData();

  data.splice(index,1);

  setData(data);

  load();

}

function load(){

  const data=getData();

  if(data.length===0){

    list.innerHTML='<div class="empty">まだ記録はありません</div>';

    return;

  }

  list.innerHTML="";

  [...data].reverse().forEach((r,revIndex)=>{

    const realIndex=data.length-1-revIndex;

    const div=document.createElement("div");

    div.className="entry";

    div.innerHTML=`

      <strong>${escapeHtml(r.hotel)}</strong><br>

      <div class="meta">${r.date||""}</div>

      <div style="margin-top:8px;white-space:pre-wrap;">${escapeHtml(r.memo)}</div>

      ${r.photo?`<img src="${r.photo}">`:""}

      <button class="del" onclick="removeItem(${realIndex})">削除</button>

    `;

    list.appendChild(div);

  });

}

function escapeHtml(text){

  return (text||"")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;");

}

load();

</script>

</body>

</html>
