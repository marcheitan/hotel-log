<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Hotel Log</title>

<style>

:root{

 --bg:#f5f7fb;

 --card:#fff;

 --blue:#2563eb;

 --red:#ef4444;

 --text:#111827;

 --sub:#6b7280;

}

*{margin:0;padding:0;box-sizing:border-box}

body{

 font-family:-apple-system,BlinkMacSystemFont,sans-serif;

 background:var(--bg);

 color:var(--text);

}

header{

 background:linear-gradient(135deg,#2563eb,#7c3aed);

 color:#fff;

 padding:26px 20px;

 border-radius:0 0 26px 26px;

}

.container{padding:16px}

.card{

 background:#fff;

 border-radius:18px;

 padding:16px;

 margin-bottom:16px;

 box-shadow:0 4px 12px rgba(0,0,0,.08);

}

.row{display:flex;justify-content:space-between;align-items:center}

.grid{

 display:grid;

 grid-template-columns:1fr 1fr;

 gap:10px;

 margin-top:12px;

}

.stat{

 background:#f9fafb;

 border-radius:14px;

 padding:12px;

 text-align:center;

}

.stat b{

 display:block;

 font-size:22px;

 color:var(--blue);

}

.small{

 color:var(--sub);

 font-size:13px;

 margin-top:10px;

}

input,textarea{

 width:100%;

 border:1px solid #ddd;

 border-radius:12px;

 padding:12px;

 font-size:16px;

 margin-top:6px;

}

button{

 width:100%;

 border:none;

 border-radius:14px;

 padding:14px;

 color:#fff;

 font-size:16px;

 font-weight:bold;

 margin-top:12px;

 background:var(--blue);

}

.delete{background:var(--red)}

.edit{background:#f59e0b}

.photos{

 display:grid;

 grid-template-columns:repeat(3,1fr);

 gap:8px;

 margin-top:10px;

}

.photos img{

 width:100%;

 aspect-ratio:1;

 object-fit:cover;

 border-radius:10px;

}

.item{

 border-top:1px solid #eee;

 padding-top:14px;

 margin-top:14px;

}

#viewer{

 position:fixed;

 inset:0;

 background:rgba(0,0,0,.9);

 display:none;

 justify-content:center;

 align-items:center;

 z-index:999;

}

#viewer img{

 max-width:95%;

 max-height:90%;

}

</style>

</head>

<body>

<header>

<h1>🏨 Hotel Log</h1>

<p>旅の思い出を残そう</p>

</header>

<div class="container">

<div class="card">

<div class="row">

<div>

<div class="small">総宿泊数</div>

<h2 id="stayCount">0</h2>

</div>

<div>

<div class="small">都市</div>

<h2 id="cityCount">0</h2>

</div>

</div>

<div class="grid">

<div class="stat">

<b id="hotelCount">0</b>

ホテル

</div>

<div class="stat">

<b id="photoCount">0</b>

写真

</div>

</div>

</div>

<div class="card">

<h3 id="formTitle">➕ 新しい思い出</h3>

<div class="small">日付</div>

<input type="date" id="date">

<div class="small">ホテル名</div>

<input id="hotel" placeholder="ホテル名">

<div class="small">都市</div>

<input id="city" placeholder="京都市">

<div class="small">今日の一言</div>

<textarea id="diary" rows="3" placeholder="思い出を書こう"></textarea>

<div class="small">写真（複数可）</div>

<input type="file" id="photo" accept="image/*" multiple>

<div id="preview" class="photos"></div>

<button id="saveBtn">保存</button>

</div>

<div class="card">

<h3>📖 最近の思い出</h3>

<div id="list"></div>

</div>

</div>

<div id="viewer" onclick="closeViewer()">

<img id="bigImg">

</div>

<script>

const KEY="hotel_log_v2";

let db={stays:[]};

let editId=null;

let photos=[];

const dateEl=document.getElementById("date");

const hotelEl=document.getElementById("hotel");

const cityEl=document.getElementById("city");

const diaryEl=document.getElementById("diary");

dateEl.valueAsDate=new Date();

document.getElementById("photo").addEventListener("change",e=>{

 const files=[...e.target.files];

 files.forEach(f=>{

  const r=new FileReader();

  r.onload=()=>{

   photos.push(r.result);

   drawPreview();

  };

  r.readAsDataURL(f);

 });

});

function drawPreview(){

 const p=document.getElementById("preview");

 p.innerHTML=photos.map(x=>`<img src="${x}">`).join("");

}

function saveDB(){

 localStorage.setItem(KEY,JSON.stringify(db));

}

function loadDB(){

 const d=localStorage.getItem(KEY);

 if(d) db=JSON.parse(d);

 render();

}

function saveStay(){

 const date=dateEl.value;

 const hotel=hotelEl.value.trim();

 const city=cityEl.value.trim();

 const diary=diaryEl.value.trim();

 if(!date||!hotel){

  alert("日付とホテル名を入力してください");

  return;

 }

 if(editId){

  const s=db.stays.find(x=>x.id===editId);

  s.date=date;

  s.hotel=hotel;

  s.city=city;

  s.diary=diary;

  s.photos=photos;

 }else{

  db.stays.unshift({

   id:Date.now(),

   date,

   hotel,

   city,

   diary,

   photos

  });

 }

 saveDB();

 resetForm();

 render();

}

document.getElementById("saveBtn").onclick=saveStay;
function resetForm(){

  editId=null;

  document.getElementById("formTitle").textContent="➕ 新しい思い出";

  dateEl.valueAsDate=new Date();

  hotelEl.value="";

  cityEl.value="";

  diaryEl.value="";

  photos=[];

  document.getElementById("photo").value="";

  drawPreview();

}

function editStay(id){

  const s=db.stays.find(x=>x.id===id);

  if(!s) return;

  editId=id;

  document.getElementById("formTitle").textContent="✏️ 思い出を編集";

  dateEl.value=s.date;

  hotelEl.value=s.hotel;

  cityEl.value=s.city;

  diaryEl.value=s.diary;

  photos=[...(s.photos||[])];

  drawPreview();

  window.scrollTo({top:0,behavior:"smooth"});

}

function delStay(id){

  if(!confirm("削除しますか？")) return;

  db.stays=db.stays.filter(x=>x.id!==id);

  saveDB();

  render();

}

function openViewer(src){

  document.getElementById("viewer").style.display="flex";

  document.getElementById("bigImg").src=src;

}

function closeViewer(){

  document.getElementById("viewer").style.display="none";

}

function render(){

  document.getElementById("stayCount").textContent=db.stays.length;

  document.getElementById("cityCount").textContent=

    new Set(db.stays.map(x=>x.city).filter(Boolean)).size;

  document.getElementById("hotelCount").textContent=

    new Set(db.stays.map(x=>x.hotel)).size;

  document.getElementById("photoCount").textContent=

    db.stays.reduce((n,x)=>n+(x.photos?.length||0),0);

  const list=document.getElementById("list");

  if(db.stays.length===0){

    list.innerHTML="<p>まだ登録がありません</p>";

    return;

  }

  list.innerHTML=db.stays.map(x=>`

    <div class="item">

      <div class="row">

        <b>${x.hotel}</b>

        <small>${x.date}</small>

      </div>

      <div style="color:#666;margin:4px 0">

        📍 ${x.city||"-"}

      </div>

      <div style="margin:8px 0">

        ${x.diary||""}

      </div>

      <div class="photos">

        ${(x.photos||[]).map(p=>`

          <img src="${p}" onclick="openViewer('${p}')">

        `).join("")}

      </div>

      <div class="row" style="gap:8px;margin-top:10px">

        <button class="edit" onclick="editStay(${x.id})">

          編集

        </button>

        <button class="delete" onclick="delStay(${x.id})">

          削除

        </button>

      </div>

    </div>

  `).join("");

}

loadDB();

document.getElementById("saveBtn").onclick = saveStay;

window.addEventListener("load",()=>{

  document.getElementById("date").valueAsDate = new Date();

});

</script>

</body>

</html>
