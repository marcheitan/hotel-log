<!doctype html><html lang='ja'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ホテルログ</title><style>body{font-family:-apple-system;background:#f3f4f6;margin:0}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}input,select,textarea,button{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:none}.item{border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:8px}</style><main><div class='card' style='background:#2563eb;color:#fff'><h2>🏨 ホテルログ</h2><div id='count'>0泊</div></div><div class='card'><h3>宿泊登録</h3><input id='d' type='date'><input id='h' placeholder='ホテル名'><select id='p'><option>仕事</option><option>旅行</option><option>家族旅行</option></select><textarea id='m' placeholder='メモ'></textarea><button onclick='save()'>保存</button></div><div class='card'><h3>履歴</h3><div id='list'>まだありません</div></div></main><script>let data=JSON.parse(localStorage.hotelLog||'[]');function r(){count.textContent=data.length+'泊';list.innerHTML='';if(!data.length){list.textContent='まだありません';return;}data.sort((a,b)=>b.d.localeCompare(a.d));data.forEach((x,i)=>{let e=document.createElement('div');e.className='item';e.innerHTML='<b>'+x.h+'</b><br>'+x.d+'・'+x.p+'<br>'+(x.m||'')+'<br><button onclick="del('+i+')">削除</button>';list.appendChild(e);});}function save(){if(!d.value||!h.value){alert('日付とホテル名');return;}data.push({d:d.value,h:h.value,p:p.value,m:m.value});localStorage.hotelLog=JSON.stringify(data);d.value=h.value=m.value='';r();}function del(i){data.splice(i,1);localStorage.hotelLog=JSON.stringify(data);r();}r();</script></html>
